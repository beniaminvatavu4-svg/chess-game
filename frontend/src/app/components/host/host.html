<div class="host-page">
  <h1>Chess Live Event</h1>

  @if (!room) {
    <div class="create-section">
      <p>Creează un meci nou pentru a genera codurile QR</p>
      <button class="btn-primary" [disabled]="loading" (click)="createRoom()">
        {{ loading ? 'Se creează…' : 'Creează meci' }}
      </button>
      @if (error) {
        <p class="error">{{ error }}</p>
      }
    </div>
  } @else {
    <div class="setup-grid">

      <div class="link-card">
        <span class="link-label">Link Jucător 2 (Negru)</span>
        <div class="copy-row">
          <code class="link-url">{{ joinUrl }}</code>
          <button class="btn-copy" (click)="copyJoinUrl()">{{ joinCopied ? 'Copiat!' : 'Copiază' }}</button>
        </div>
      </div>

      <div class="link-card">
        <span class="link-label">Link vizionare (Watch)</span>
        <div class="copy-row">
          <code class="link-url">{{ watchUrl }}</code>
          <button class="btn-copy" (click)="copyWatchUrl()">{{ watchCopied ? 'Copiat!' : 'Copiază' }}</button>
        </div>
      </div>

      <button class="btn-primary btn-play" (click)="goToPlay()">
        Joacă ca Alb →
      </button>

    </div>
  }
</div>
